<title>1854 DKP System</title>

<style>
/* FULL STYLES */
body { font-family: 'Poppins', sans-serif; background: #f0f2f5; color: #333; margin: 0; padding: 20px; transition: background 0.4s ease; overflow-x: hidden; }
#potato-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
.container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); position: relative; z-index: 10; transition: all 0.4s ease; }
.modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 9999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
.modal-content { width: 90%; max-width: 350px; padding: 25px; position: relative; text-align: left; border-radius: 20px; }
.close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; color: #888; cursor: pointer; }
.unified-panel { background: #fafafa; border: 2px solid #e4e6eb; border-radius: 12px; box-sizing: border-box; transition: all 0.3s ease; }
.header-section { text-align: center; margin-bottom: 25px; padding: 20px 15px; position: relative; }
.point-values { font-size: 13px; color: #555; font-weight: 600; margin-top: 5px; }
.admin-btn { position: absolute; bottom: 8px; right: 12px; font-size: 14px; cursor: pointer; opacity: 0.3; }
.admin-btn:hover { opacity: 1; }
input { width: 100%; padding: 14px; margin: 8px 0; font-size: 15px; border: 2px solid #e4e6eb; border-radius: 12px; background: #fafafa; color: #333; outline: none; transition: 0.3s; }
input:focus { border-color: #007aff; background: #fff; }
button.main-btn { width: 100%; padding: 14px; margin-top: 12px; background: #007aff; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3); }
.card-actions { display: flex; gap: 10px; margin-top: 12px; }
.btn-small-danger, .btn-small-discord { border-radius: 8px; padding: 10px 12px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; border: 1px solid #eee; transition: 0.2s; }
.btn-small-danger { background: #ffe5e5; color: #ff3b30; }
.btn-small-discord { background: #5865F2; color: white; border: none; }
.progress-bg { background: #e4e6eb; border-radius: 10px; height: 24px; width: 100%; overflow: hidden; margin-bottom: 10px; position: relative; }
.progress-fill { height: 100%; border-radius: 10px; transition: width 0.6s ease; background: #007aff; }
.progress-text { position: absolute; width: 100%; text-align: center; font-size: 11px; font-weight: 800; line-height: 24px; color: #1a1a1a; }
.log-entry { background: #fff; padding: 10px; margin-bottom: 5px; border-radius: 8px; border-left: 4px solid #ccc; font-size: 12px; }
.top-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.left-controls { display: flex; gap: 8px; }
.logout-btn { background: #ffe5e5; color: #ff3b30; border: none; border-radius: 20px; padding: 6px 12px; font-size: 11px; cursor: pointer; font-weight: 600; }
.lang-select { background: #e4e6eb; border: none; border-radius: 20px; padding: 6px 10px; font-size: 11px; cursor: pointer; font-weight: 600; }
.acc-tag { display: inline-block; background: #eef3ff; color: #007aff; padding: 2px 8px; border-radius: 12px; font-size: 10px; margin-right: 4px; font-weight: 600; margin-bottom: 4px; }
#giant-hammer { position: fixed; top: -10vh; left: 50vw; font-size: 180px; z-index: 9999; opacity: 0; pointer-events: none; transform-origin: bottom left; }
.swinging { animation: swingHammer 0.6s ease-in forwards; }
@keyframes swingHammer { 0% { opacity: 1; transform: rotate(60deg); } 60% { opacity: 1; transform: rotate(-25deg); } 100% { opacity: 0; transform: rotate(-25deg); } }
#impact-effect { position: fixed; top: 30vh; left: 45vw; transform: translate(-50%, -50%) scale(0); font-size: 160px; z-index: 9998; opacity: 0; }
.pow-active { animation: powEffect 0.5s ease-out forwards; }
@keyframes powEffect { 0% { opacity: 1; transform: scale(0.3); } 20% { opacity: 1; transform: scale(1.3); } 100% { opacity: 0; transform: scale(1.6); } }
.smashed { animation: shakeScreen 0.5s ease-in-out; transform: translateY(200vh) rotate(25deg) !important; transition: transform 1.5s ease-in 0.4s, opacity 1s ease-in 1s !important; opacity: 0; pointer-events: none; }
@keyframes shakeScreen { 0%, 100% { transform: translate(0,0); } 10%, 30%, 50%, 70%, 90% { transform: translate(-5px,-5px); } 20%, 40%, 60%, 80% { transform: translate(5px,5px); } }
body.dark-mode { background: #121212; color: #b0b0b0; }
body.dark-mode .container, body.dark-mode .modal-content { background: #1e1e1e; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
body.dark-mode .unified-panel { background: #252525; border-color: #333; }
body.dark-mode input { background: #252525; color: #eee; border-color: #333; }
body.dark-mode .log-entry { background: #1e1e1e; border-color: #444; color: #eee; }
body.dark-mode .lang-select { background: #333; color: #eee; }
</style>
</head>

<body>

<div id="authModal" class="modal-overlay">
    <div class="unified-panel modal-content">
        <h3 style="text-align:center;">Kingdom Vault</h3>
        <p>Login with your game name and a password.</p>
        <input type="text" id="authUsername" placeholder="Enter Rise of Kingdoms Name">
        <input type="password" id="authPassword" placeholder="Password">
        <button class="main-btn" onclick="processAuth()">Enter Vault</button>
        <div id="authError" style="color:#ff3b30; font-size:12px; margin-top:10px; text-align:center; font-weight:600;"></div>
    </div>
</div>

<div id="adminModal" class="modal-overlay" style="display:none;">
    <div class="unified-panel modal-content">
        <span class="close-btn" onclick="closeAdmin()">×</span>
        <h3>Admin Settings</h3>
        <label>T4 Points</label><input type="number" id="editT4" step="0.1">
        <label>T5 Points</label><input type="number" id="editT5" step="0.1">
        <label>Combined Points</label><input type="number" id="editT4T5" step="0.1">
        <label>Dead Points</label><input type="number" id="editDeads" step="0.1">
        <button class="main-btn" style="background:#34c759" onclick="saveAdminSettings()">Save Cloud Settings</button>
    </div>
</div>

<canvas id="potato-canvas"></canvas>
<div id="giant-hammer">🔨</div>
<div id="impact-effect">💥</div>

<div id="main-app" class="container" style="display:none;">
  <div class="top-controls">
    <div class="left-controls">
      <button class="lang-select" style="border-radius: 50%; width: 35px; height: 35px;" onclick="toggleTheme()">🌙</button>
      <button class="lang-select" style="border-radius: 50%; width: 35px; height: 35px;" onclick="smashScreen()">🔨</button>
    </div>
    <div class="left-controls">
        <select id="langSelect" class="lang-select" onchange="changeLanguage()"></select>
        <button class="logout-btn" onclick="logoutUser()">Log Out</button>
    </div>
  </div>

  <div class="unified-panel header-section">
    <h2 id="mainTitle"><span onclick="toggleGravity()" style="cursor:pointer">🏆</span> 1854 DKP System <span onclick="toggleGravity()" style="cursor:pointer">🏆</span></h2>
    <div id="pointValues" class="point-values"></div>
    <div class="dkp-goal" style="font-size:10px; color:#007aff; margin-top: 5px;">🔒 Private Vault Active</div>
    <span class="admin-btn" id="settingsGear" onclick="openAdmin()">⚙️</span>
  </div>

  <input id="name" placeholder="Name" readonly>
  <input id="startingPower" type="text" inputmode="numeric" placeholder="Starting Power">
  <div style="text-align:center; margin: 10px 0;"><span id="toggleModeText" style="font-size:12px; color:#007aff; cursor:pointer; font-weight:600;" onclick="toggleKillMode()">Combine T4 & T5 Kills</span></div>
  
  <input id="t4" type="text" inputmode="numeric" placeholder="T4 kills">
  <input id="t5" type="text" inputmode="numeric" placeholder="T5 kills">
  <input id="t4t5" type="text" inputmode="numeric" placeholder="T4 & T5 Kills" style="display: none;">
  <input id="deads" type="text" inputmode="numeric" placeholder="Deads">
  
  <div class="unified-panel live" id="live" style="margin-top:15px; padding:12px; text-align:center; font-weight:bold; color:#007aff;">DKP: 0 | 0%</div>
  <button id="saveBtn" class="main-btn" onclick="savePlayer()">Save Player</button>

  <div id="combinePanel" class="unified-panel header-section" style="margin-top: 30px; border-top: 2px dashed #eee; padding-top: 20px;">
    <h3 class="panel-title">🧮 Combine Your Accounts</h3>
    <input id="combinedName" placeholder="Total Stats Name (e.g. My Total)">
    <div id="combineCheckboxes" style="max-height: 150px; overflow-y: auto; background: white; border: 1px solid #eee; border-radius: 10px; padding: 10px; text-align: left;"></div>
    <button class="main-btn" style="background:#34c759" onclick="createCombinedCard()">Combine Selected</button>
  </div>

  <div id="savedDataContainer" style="margin-top: 30px;">
    <h3 id="logsTitle" style="text-align:center; font-size: 16px;">💾 Player Logs</h3>
    <div id="combinedDataList"></div>
    <div id="savedDataList"></div>
  </div>
</div>

<script>
// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyAIPs8b6aSVEx3ApDP1TupSOfIEesVoIbM",
  authDomain: "dkp-37749.firebaseapp.com",
  projectId: "dkp-37749",
  storageBucket: "dkp-37749.firebasestorage.app",
  messagingSenderId: "650648006750",
  appId: "1:650648006750:web:79d00d4af6fa9e2f5744cf"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let cloudPlayers = [], cloudCombined = [], isAdmin = false, isCombinedMode = false, currentUserId = null;
let dkpPoints = { t4: 2, t5: 5, t4t5: 3.5, deads: 15 };
let currentLang = localStorage.getItem("lang") || "en";
const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1500504658186338386/9XmK-jNtHSH-kovVsmcnJm0nf-f_xjyMeP9w1ykYeeQCf_WGZ2E8qTJZO1ErArrzYw5g";

// TRANSLATIONS
const i18n = {
  en: { title: "1854 DKP System", points: "T4: {t4} | T5: {t5} | Deads: {deads}", pointsCombined: "T4/T5: {t4t5} | Deads: {deads}", phPower: "Starting Power", phT4: "T4 Kills", phT5: "T5 Kills", phT4T5: "Combined Kills", phDeads: "Deads", btnSave: "Save Player", logTitle: "💾 Player Logs", clearBtn: "Clear", shareBtn: "Share" },
  us: { title: "1854 DKP Dashboard", points: "T4: {t4} pts | T5: {t5} pts | Deads: {deads} pts", pointsCombined: "Combined: {t4t5} pts | Deads: {deads} pts", phPower: "Power Level", phT4: "T4 Kills", phT5: "T5 Kills", phT4T5: "T4/T5 Total", phDeads: "Dead Troops", btnSave: "Submit Data", logTitle: "💾 Account History", clearBtn: "Delete", shareBtn: "Discord" },
  es: { title: "Sistema DKP 1854", points: "T4: {t4} | T5: {t5} | Muertos: {deads}", pointsCombined: "T4/T5: {t4t5} | Muertos: {deads}", phPower: "Poder Inicial", phT4: "Muertes T4", phT5: "Muertes T5", phT4T5: "Muertes Combinadas", phDeads: "Muertos", btnSave: "Guardar", logTitle: "💾 Registros", clearBtn: "Borrar", shareBtn: "Compartir" },
  fr: { title: "Système DKP 1854", points: "T4: {t4} | T5: {t5} | Morts: {deads}", pointsCombined: "T4/T5: {t4t5} | Morts: {deads}", phPower: "Puissance Initiale", phT4: "Tués T4", phT5: "Tués T5", phT4T5: "Tués Combinés", phDeads: "Morts", btnSave: "Enregistrer", logTitle: "💾 Journaux", clearBtn: "Effacer", shareBtn: "Partager" },
  zh: { title: "1854 DKP 系统", points: "T4: {t4} | T5: {t5} | 阵亡: {deads}", pointsCombined: "T4/T5: {t4t5} | 阵亡: {deads}", phPower: "初始战力", phT4: "T4 击杀", phT5: "T5 击杀", phT4T5: "合并击杀", phDeads: "阵亡", btnSave: "保存玩家", logTitle: "💾 记录", clearBtn: "清除", shareBtn: "分享" },
  ko: { title: "1854 DKP 시스템", points: "T4: {t4} | T5: {t5} | 전사: {deads}", pointsCombined: "T4/T5: {t4t5} | 전사: {deads}", phPower: "초기 투력", phT4: "T4 킬", phT5: "T5 킬", phT4T5: "통합 킬", phDeads: "전사", btnSave: "저장하기", logTitle: "💾 기록", clearBtn: "삭제", shareBtn: "공유" },
  vi: { title: "Hệ thống DKP 1854", points: "T4: {t4} | T5: {t5} | Chết: {deads}", pointsCombined: "T4/T5: {t4t5} | Chết: {deads}", phPower: "Sức mạnh ban đầu", phT4: "Giết T4", phT5: "Giết T5", phT4T5: "Giết Gộp", phDeads: "Lính Chết", btnSave: "Lưu", logTitle: "💾 Nhật ký", clearBtn: "Xóa", shareBtn: "Chia sẻ" },
  th: { title: "ระบบ 1854 DKP", points: "T4: {t4} | T5: {t5} | ตาย: {deads}", pointsCombined: "T4/T5: {t4t5} | ตาย: {deads}", phPower: "พลังเริ่มต้น", phT4: "คิล T4", phT5: "คิล T5", phT4T5: "คิลรวม", phDeads: "ทหารตาย", btnSave: "บันทึก", logTitle: "💾 บันทึก", clearBtn: "ล้าง", shareBtn: "แชร์" }
};

const langSelect = document.getElementById("langSelect");
const languages = [{v:"en", n:"🇬🇧 UK"}, {v:"us", n:"🇺🇸 US"}, {v:"fr", n:"🇫🇷 FR"}, {v:"es", n:"🇪🇸 ES"}, {v:"zh", n:"🇨🇳 ZH"}, {v:"ko", n:"🇰🇷 KO"}, {v:"vi", n:"🇻🇳 VI"}, {v:"th", n:"🇹🇭 TH"}];
languages.forEach(l => { const opt = document.createElement("option"); opt.value = l.v; opt.innerText = l.n; langSelect.appendChild(opt); });
langSelect.value = currentLang;

function changeLanguage() { currentLang = langSelect.value; localStorage.setItem("lang", currentLang); applyTranslations(); }
function applyTranslations() {
    const t = i18n[currentLang] || i18n['en'];
    document.getElementById("mainTitle").innerHTML = `<span onclick="toggleGravity()" style="cursor:pointer">🏆</span> ${t.title} <span onclick="toggleGravity()" style="cursor:pointer">🏆</span>`;
    let ps = isCombinedMode ? t.pointsCombined : t.points;
    document.getElementById("pointValues").innerHTML = ps.replace('{t4}', dkpPoints.t4).replace('{t5}', dkpPoints.t5).replace('{t4t5}', dkpPoints.t4t5).replace('{deads}', dkpPoints.deads);
    document.getElementById("startingPower").placeholder = t.phPower;
    document.getElementById("t4").placeholder = t.phT4;
    document.getElementById("t5").placeholder = t.phT5;
    document.getElementById("t4t5").placeholder = t.phT4T5;
    document.getElementById("deads").placeholder = t.phDeads;
    document.getElementById("saveBtn").innerText = t.btnSave;
    document.getElementById("logsTitle").innerText = t.logTitle;
    displaySavedData();
}

// AUTH
function processAuth() {
    const user = document.getElementById('authUsername').value.trim();
    const pass = document.getElementById('authPassword').value;
    const errDiv = document.getElementById('authError');
    if(!user || !pass) { errDiv.innerText = "Enter RoK name and password."; return; }
    const email = user.toLowerCase().replace(/\s/g, '') + "@1854.com";
    auth.signInWithEmailAndPassword(email, pass).catch(err => {
        if(err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found') {
            auth.createUserWithEmailAndPassword(email, pass).catch(e => { errDiv.innerText = e.message; });
        } else { errDiv.innerText = err.message; }
    });
}
function logoutUser() { auth.signOut(); location.reload(); }

auth.onAuthStateChanged(u => {
    if (u) {
        currentUserId = u.uid;
        document.getElementById('authModal').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('name').value = u.email.split('@')[0];
        db.collection("settings").doc("dkpPoints").onSnapshot(doc => { if(doc.exists) { dkpPoints = doc.data(); applyTranslations(); updateLive(); } });
        if(u.email.toLowerCase() === 'snowy_north001@1854.com') {
            isAdmin = true; document.getElementById('settingsGear').style.display = 'inline-block';
            db.collection("guildLog").onSnapshot(snap => syncData(snap));
            db.collection("guildCombinedLogs").onSnapshot(snap => syncComb(snap));
        } else {
            isAdmin = false; 
            db.collection("guildLog").where("userId", "==", u.uid).onSnapshot(snap => syncData(snap));
            db.collection("guildCombinedLogs").where("userId", "==", u.uid).onSnapshot(snap => syncComb(snap));
        }
    } else { document.getElementById('authModal').style.display = 'flex'; document.getElementById('main-app').style.display = 'none'; }
});

function syncData(snap) { cloudPlayers = []; snap.forEach(doc => { let d = doc.data(); d.id = doc.id; cloudPlayers.push(d); }); cloudPlayers.sort((a,b) => b.timestampMs - a.timestampMs); displaySavedData(); updateCombineCheckboxes(); }
function syncComb(snap) { cloudCombined = []; snap.forEach(d => { let x = d.data(); x.id = d.id; cloudCombined.push(x); }); renderCombinedCards(); }

function savePlayer() {
    const sp = Number(document.getElementById("startingPower").value.replace(/,/g,'')) || 0, t4 = isCombinedMode ? 0 : (Number(document.getElementById("t4").value.replace(/,/g,'')) || 0), t5 = isCombinedMode ? 0 : (Number(document.getElementById("t5").value.replace(/,/g,'')) || 0), t4t5 = isCombinedMode ? (Number(document.getElementById("t4t5").value.replace(/,/g,'')) || 0) : 0, d = Number(document.getElementById("deads").value.replace(/,/g,'')) || 0;
    db.collection("guildLog").add({ userId: currentUserId, name: document.getElementById("name").value, startingPower: sp, t4, t5, t4t5, deads: d, dkp: (t4*dkpPoints.t4)+(t5*dkpPoints.t5)+(t4t5*dkpPoints.t4t5)+(d*dkpPoints.deads), timestampString: new Date().toLocaleString(), timestampMs: Date.now(), isCombined: isCombinedMode });
    ["startingPower","t4","t5","t4t5","deads"].forEach(id => document.getElementById(id).value=""); updateLive();
}

function displaySavedData() {
    const t = i18n[currentLang] || i18n['en'];
    let html = ""; const groups = {}; cloudPlayers.forEach(p => { const k = p.name.toLowerCase(); if (!groups[k]) groups[k] = { name: p.name, entries: [] }; groups[k].entries.push(p); });
    Object.values(groups).sort((a, b) => b.entries[0].startingPower - a.entries[0].startingPower).forEach(g => {
        const latest = g.entries[0], percent = latest.startingPower > 0 ? ((latest.dkp / latest.startingPower) * 100).toFixed(2) : 0;
        html += `<div class="unified-panel player-card"><div class="player-title">👤 ${g.name}</div><div style="font-size:12px;">Progress: ${percent}%</div><div class="progress-bg"><div class="progress-fill" style="width:${Math.min(percent,100)}%;"></div><div class="progress-text">${percent}%</div></div>`;
        g.entries.forEach(e => { html += `<div class="log-entry"><strong>DKP: ${e.dkp.toLocaleString()}</strong><br><span style="font-size:10px; color:#888;">${e.timestampString}</span></div>`; });
        html += `<div class="card-actions"><button class="btn-small-discord" onclick="sendToDiscord('${g.name}')">👾 Share</button><button class="btn-small-danger" onclick="clearLogs('${g.name}')">🗑️ ${t.clearBtn}</button></div></div>`;
    });
    document.getElementById("savedDataList").innerHTML = html || "<p style='text-align:center; font-size:12px;'>Vault empty.</p>";
}

function updateCombineCheckboxes() {
  const names = [...new Set(cloudPlayers.map(p => p.name))];
  const container = document.getElementById("combineCheckboxes");
  container.innerHTML = "";
  names.forEach(n => { container.innerHTML += `<label style="display:block; margin-bottom:5px;"><input type="checkbox" value="${n}" class="combine-cb"> ${n}</label>`; });
}

function createCombinedCard() {
  const name = document.getElementById("combinedName").value.trim();
  const selected = Array.from(document.querySelectorAll(".combine-cb:checked")).map(cb => cb.value);
  if(!name || selected.length < 2) return alert("Select 2+ names");
  db.collection("guildCombinedLogs").add({ userId: currentUserId, name, accounts: selected, createdAt: Date.now() });
}

function renderCombinedCards() {
  let html = "";
  cloudCombined.forEach(c => {
    let totDkp = 0, totPower = 0, tags = "";
    c.accounts.forEach(acc => { tags += `<span class="acc-tag">${acc}</span>`; const p = cloudPlayers.find(x => x.name.toLowerCase() === acc.toLowerCase()); if(p){ totDkp += p.dkp; totPower += p.startingPower; } });
    html += `<div class="unified-panel player-card" style="border: 2px solid #ffd700;"><div class="player-title">🧮 ${c.name}</div><div>${tags}</div><div class="log-entry"><strong>Total DKP: ${totDkp.toLocaleString()}</strong><br>Power: ${totPower.toLocaleString()}</div><div class="card-actions"><button class="btn-small-discord" onclick="shareCombinedDiscord('${c.id}')">👾 Share</button><button class="btn-small-danger" onclick="db.collection('guildCombinedLogs').doc('${c.id}').delete()">🗑️ Clear</button></div></div>`;
  });
  document.getElementById("combinedDataList").innerHTML = html;
}

// PHYSICS
const Engine = Matter.Engine, world = Engine.create().world, render = Matter.Render.create({ canvas: document.getElementById('potato-canvas'), engine: {world}, options:{ width: window.innerWidth, height: window.innerHeight, background:'transparent', wireframes:false } });
Matter.Composite.add(world, Matter.Bodies.rectangle(window.innerWidth/2, window.innerHeight+25, window.innerWidth*2, 50, {isStatic:true}));
Matter.Render.run(render); Matter.Runner.run(Matter.Runner.create(), {world});
let potatoes = [];
setInterval(() => { if(potatoes.length < 35) { const r=15, b=Matter.Bodies.circle(Math.random()*window.innerWidth,-50,r,{restitution:0.3,density:0.05,render:{visible:false}}); Matter.Composite.add(world,b); potatoes.push({body:b, fs:r*2, type:'potato'}); } }, 300);
window.addEventListener('click', (e) => { potatoes.forEach(p => { if (Math.sqrt(Math.pow(p.body.position.x-e.clientX,2)+Math.pow(p.body.position.y-e.clientY,2)) < 30) { p.type = 'fry'; Matter.Body.setVelocity(p.body, {x:(Math.random()-0.5)*10, y:-10}); } }); });
Matter.Events.on(render, 'afterRender', () => { const ctx = render.context; ctx.textAlign="center"; ctx.textBaseline="middle"; potatoes.forEach(p => { ctx.save(); ctx.globalAlpha=0.4; ctx.font=p.fs+"px Arial"; ctx.translate(p.body.position.x, p.body.position.y); ctx.rotate(p.body.angle); ctx.fillText(p.type==='fry'?'🍟':'🥔',0,0); ctx.restore(); }); });

// HELPERS
function updateLive() {
    const sp = Number(document.getElementById("startingPower").value.replace(/,/g,'')) || 0, t4 = isCombinedMode ? 0 : Number(document.getElementById("t4").value.replace(/,/g,'')) || 0, t5 = isCombinedMode ? 0 : Number(document.getElementById("t5").value.replace(/,/g,'')) || 0, t4t5 = isCombinedMode ? Number(document.getElementById("t4t5").value.replace(/,/g,'')) || 0 : 0, d = Number(document.getElementById("deads").value.replace(/,/g,'')) || 0;
    const dkp = (t4*dkpPoints.t4)+(t5*dkpPoints.t5)+(t4t5*dkpPoints.t4t5)+(d*dkpPoints.deads);
    document.getElementById("live").innerText = `DKP: ${dkp.toLocaleString()} | ${sp > 0 ? (dkp/sp*100).toFixed(2) : 0}%`;
}
["startingPower","t4","t5","t4t5","deads"].forEach(id => document.getElementById(id).addEventListener("input", function() { let v = this.value.replace(/,/g, "").replace(/\D/g, ""); this.value = v ? parseInt(v).toLocaleString() : ""; updateLive(); }));
function toggleKillMode() { isCombinedMode = !isCombinedMode; document.getElementById("t4").style.display = isCombinedMode ? "none" : "block"; document.getElementById("t5").style.display = isCombinedMode ? "none" : "block"; document.getElementById("t4t5").style.display = isCombinedMode ? "block" : "none"; applyTranslations(); }
function toggleTheme() { document.body.classList.toggle("dark-mode"); }
function openAdmin() { document.getElementById('adminModal').style.display='flex'; ["editT4","editT5","editT4T5","editDeads"].forEach(id => document.getElementById(id).value = dkpPoints[id.replace('edit','').toLowerCase()]); }
function closeAdmin() { document.getElementById('adminModal').style.display='none'; }
function saveAdminSettings() { const n = { t4: parseFloat(document.getElementById('editT4').value), t5: parseFloat(document.getElementById('editT5').value), t4t5: parseFloat(document.getElementById('editT4T5').value), deads: parseFloat(document.getElementById('editDeads').value) }; db.collection("settings").doc("dkpPoints").set(n).then(() => closeAdmin()); }
function smashScreen() { document.getElementById("giant-hammer").classList.add("swinging"); setTimeout(() => { document.getElementById("impact-effect").classList.add("pow-active"); document.getElementById("main-app").classList.add("smashed"); }, 360); setTimeout(() => location.reload(), 4500); }
function toggleGravity() { world.gravity.y *= -1; }
function clearLogs(n) { if(confirm(`Clear logs for ${n}?`)) cloudPlayers.filter(p => p.name.toLowerCase() === n.toLowerCase()).forEach(p => db.collection("guildLog").doc(p.id).delete()); }

function sendToDiscord(n) {
  const p = cloudPlayers.find(x => x.name.toLowerCase() === n.toLowerCase());
  fetch(DISCORD_WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ embeds: [{ title: `🏆 ${p.name} DKP Update`, color: 5814783, fields: [ { name: "Total DKP", value: p.dkp.toLocaleString(), inline: true }, { name: "Power", value: p.startingPower.toLocaleString(), inline: true } ], timestamp: new Date().toISOString() }] }) }).then(res => alert(res.ok ? "✅ Sent!" : "❌ Error"));
}

function shareCombinedDiscord(id) {
  const c = cloudCombined.find(x => x.id === id);
  let totDkp = 0, totPower = 0;
  c.accounts.forEach(acc => { const p = cloudPlayers.find(x => x.name.toLowerCase() === acc.toLowerCase()); if(p){ totDkp += p.dkp; totPower += p.startingPower; } });
  fetch(DISCORD_WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ embeds: [{ title: `🧮 ${c.name} Combined Stats`, color: 16766720, fields: [ { name: "Total DKP", value: totDkp.toLocaleString(), inline: true }, { name: "Combined Power", value: totPower.toLocaleString(), inline: true } ], timestamp: new Date().toISOString() }] }) }).then(res => alert(res.ok ? "✅ Sent!" : "❌ Error"));
}

applyTranslations();
</script>
