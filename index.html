<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007aff">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<title>1854 DKP System</title>

<style>
/* Base Styles */
body { font-family: 'Poppins', sans-serif; background: #f0f2f5; color: #333; margin: 0; padding: 20px; transition: background 0.4s ease; overflow-x: hidden; }
#potato-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
.container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); position: relative; z-index: 10; transition: all 0.4s ease; }

/* Modals */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 9999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
.modal-content { width: 90%; max-width: 350px; padding: 25px; position: relative; text-align: left; }
.close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; color: #888; cursor: pointer; }

/* Unified Panels */
.unified-panel { background: #fafafa; border: 2px solid #e4e6eb; border-radius: 12px; box-sizing: border-box; transition: all 0.3s ease; }
.header-section { text-align: center; margin-bottom: 25px; padding: 20px 15px; position: relative; }
.header-section h2 { margin: 0 0 10px 0; font-weight: 700; }
.admin-btn { position: absolute; bottom: 8px; right: 12px; font-size: 14px; cursor: pointer; opacity: 0.3; }
.admin-btn:hover { opacity: 1; }

/* Form Elements */
input { width: 100%; padding: 14px; margin: 8px 0; font-size: 15px; font-family: 'Poppins', sans-serif; box-sizing: border-box; border: 2px solid #e4e6eb; border-radius: 12px; background: #fafafa; color: #333; transition: all 0.3s ease; }
input:focus { border-color: #007aff; background: #fff; outline: none; }
button.main-btn { width: 100%; padding: 14px; margin-top: 12px; background: #007aff; color: #f8f9fa; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 600; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3); }

/* Card Elements */
.card-actions { display: flex; gap: 10px; margin-top: 12px; }
.btn-small-danger, .btn-small-discord { border-radius: 8px; padding: 10px 12px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
.btn-small-danger { background: #ffe5e5; color: #ff3b30; border: 1px solid #ffccce; }
.btn-small-discord { background: #5865F2; color: #ffffff; border: none; }
.progress-bg { background: #e4e6eb; border-radius: 10px; height: 24px; width: 100%; overflow: hidden; margin-bottom: 15px; position: relative; }
.progress-fill { height: 100%; border-radius: 10px; transition: width 0.6s ease; }
.progress-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; text-align: center; font-size: 11px; font-weight: 800; line-height: 24px; color: #1a1a1a; }
.log-entry { background: #fff; padding: 12px; margin-bottom: 8px; border-radius: 10px; border-left: 4px solid #007aff; font-size: 13px; }

/* Top Nav */
.top-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.left-controls { display: flex; gap: 8px; }
.logout-btn { background: #ffe5e5; color: #ff3b30; border: none; border-radius: 20px; padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: 12px; }
.theme-toggle, .hammer-btn { background: #e4e6eb; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 18px; }

/* Dark Mode */
body.dark-mode { background: #121212; color: #b0b0b0; }
body.dark-mode .container { background: #1e1e1e; }
body.dark-mode .unified-panel { background: #252525; border-color: #333; }
body.dark-mode input { background: #252525; color: #eee; border-color: #333; }

/* Hammer Effect */
#giant-hammer { position: fixed; top: -10vh; left: 50vw; font-size: 180px; z-index: 9999; opacity: 0; pointer-events: none; transform-origin: bottom left; transform: rotate(60deg); }
.swinging { animation: swingHammer 0.6s ease-in forwards; }
@keyframes swingHammer { 0% { opacity: 1; transform: rotate(60deg); } 60% { opacity: 1; transform: rotate(-25deg); } 100% { opacity: 0; transform: rotate(-25deg); } }
#impact-effect { position: fixed; top: 30vh; left: 45vw; transform: translate(-50%, -50%) scale(0); font-size: 160px; z-index: 9998; opacity: 0; }
.pow-active { animation: powEffect 0.5s ease-out forwards; }
@keyframes powEffect { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.3); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); } }
.smashed { animation: shakeScreen 0.5s ease-in-out; transform: translateY(200vh) rotate(25deg) !important; transition: transform 1.5s ease-in 0.4s, opacity 1s ease-in 1s !important; opacity: 0; pointer-events: none; }
@keyframes shakeScreen { 0%, 100% { transform: translate(0,0); } 10%, 30%, 50%, 70%, 90% { transform: translate(-5px, -5px); } 20%, 40%, 60%, 80% { transform: translate(5px, 5px); } }
</style>
</head>

<body>

<div id="authModal" class="modal-overlay">
    <div class="unified-panel modal-content">
        <h3>Kingdom Vault</h3>
        <p>Log in with your RoK name and a Password.</p>
        <input type="text" id="authUsername" placeholder="Enter Rise Of Kingdoms Name">
        <input type="password" id="authPassword" placeholder="Password">
        <button class="main-btn" onclick="processAuth()">Enter Vault</button>
        <div id="authError" style="color:#ff3b30; font-size:12px; margin-top:10px; text-align:center; font-weight:600;"></div>
    </div>
</div>

<div id="adminModal" class="modal-overlay" style="display:none;">
    <div class="unified-panel modal-content">
        <span class="close-btn" onclick="closeAdmin()">×</span>
        <h3>Admin Settings</h3>
        <label>T4 Points</label><input type="number" id="editT4" step="0.1">
        <label>T5 Points</label><input type="number" id="editT5" step="0.1">
        <label>Combined Points</label><input type="number" id="editT4T5" step="0.1">
        <label>Dead Points</label><input type="number" id="editDeads" step="0.1">
        <button class="main-btn" style="background:#34c759" onclick="saveAdminSettings()">Save Cloud Settings</button>
    </div>
</div>

<canvas id="potato-canvas"></canvas>
<div id="giant-hammer">🔨</div>
<div id="impact-effect">💥</div>

<div id="main-app" class="container" style="display:none;">
  <div class="top-controls">
    <div class="left-controls">
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
      <button class="hammer-btn" onclick="smashScreen()">🔨</button>
    </div>
    <button class="logout-btn" onclick="logoutUser()">Log Out</button>
  </div>

  <div class="unified-panel header-section">
    <h2>🏆 1854 DKP System 🏆</h2>
    <div id="pointValues" class="point-values" style="font-size: 12px; color: #666;"></div>
    <div class="dkp-goal" style="font-size:10px; color:#007aff; margin-top: 5px;">🔒 Private Vault Active</div>
    <span class="admin-btn" id="settingsGear" onclick="openAdmin()">⚙️</span>
  </div>

  <input id="name" placeholder="Rise of Kingdoms Name" readonly>
  <input id="startingPower" type="text" inputmode="numeric" placeholder="Starting Power">
  <div class="toggle-link-container"><span id="toggleModeText" class="toggle-link" onclick="toggleKillMode()">Combine T4 & T5 Kills</span></div>
  
  <input id="t4" type="text" inputmode="numeric" placeholder="T4 kills">
  <input id="t5" type="text" inputmode="numeric" placeholder="T5 kills">
  <input id="t4t5" type="text" inputmode="numeric" placeholder="T4 & T5 Kills" style="display: none;">
  <input id="deads" type="text" inputmode="numeric" placeholder="Deads">
  
  <div class="unified-panel live" id="live" style="margin-top:15px; padding:12px; text-align:center; font-weight:bold; color:#007aff;">DKP: 0 | 0%</div>
  <button id="saveBtn" class="main-btn" onclick="savePlayer()">Save Player</button>

  <div id="combinePanel" class="unified-panel header-section section-divider" style="display: none; margin-top: 30px;">
    <h3 class="panel-title">🧮 Combine Accounts</h3>
    <input id="combinedName" placeholder="Group Name">
    <div id="combineCheckboxes" class="checkbox-container"></div>
    <button class="main-btn" style="background:#34c759" onclick="createCombinedCard()">Combine Selected</button>
  </div>

  <div id="savedDataContainer" class="section-divider">
    <h3 class="logs-header" style="text-align:center; margin-bottom: 15px;">💾 Player Logs</h3>
    <div id="combinedDataList"></div>
    <div id="savedDataList"></div>
  </div>
</div>

<script>
// ==========================================
// 1. FIREBASE CONFIGURATION
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyAIPs8b6aSVEx3ApDP1TupSOfIEesVoIbM",
  authDomain: "dkp-37749.firebaseapp.com",
  projectId: "dkp-37749",
  storageBucket: "dkp-37749.firebasestorage.app",
  messagingSenderId: "650648006750",
  appId: "1:650648006750:web:79d00d4af6fa9e2f5744cf"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let cloudPlayers = [], cloudCombined = [], isAdmin = false, isCombinedMode = false, currentUserId = null;
let dkpPoints = { t4: 2, t5: 5, t4t5: 3.5, deads: 15 };
let unsubLogs = null, unsubComb = null, unsubSets = null;
const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1500504658186338386/9XmK-jNtHSH-kovVsmcnJm0nf-f_xjyMeP9w1ykYeeQCf_WGZ2E8qTJZO1ErArrzYw5g";

// ==========================================
// 2. AUTHENTICATION & BOUNCER LOGIC
// ==========================================
function processAuth() {
    const user = document.getElementById('authUsername').value.trim();
    const pass = document.getElementById('authPassword').value;
    const errDiv = document.getElementById('authError');
    
    if(!user || !pass) { errDiv.innerText = "Enter RoK name and password."; return; }
    errDiv.innerText = "Connecting...";

    const email = user.toLowerCase().replace(/\s/g, '') + "@1854.com";

    auth.signInWithEmailAndPassword(email, pass).catch(err => {
        if(err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found') {
            auth.createUserWithEmailAndPassword(email, pass).catch(e => { 
                if(e.code === 'auth/email-already-in-use') errDiv.innerText = "Incorrect password for this user.";
                else errDiv.innerText = e.message; 
            });
        } else { errDiv.innerText = err.message; }
    });
}

function logoutUser() { auth.signOut(); location.reload(); }

auth.onAuthStateChanged(u => {
    if (u) {
        currentUserId = u.uid;
        document.getElementById('authModal').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('name').value = u.email.split('@')[0];
        
        startSettingsListener();
        if(u.email.toLowerCase() === 'snowy_north001@1854.com') {
            isAdmin = true;
            document.getElementById('settingsGear').style.display = 'inline-block';
            document.getElementById('combinePanel').style.display = 'block';
            startAdminListeners();
        } else {
            isAdmin = false;
            startPlayerListeners(u.uid);
        }
    } else {
        document.getElementById('authModal').style.display = 'flex';
        document.getElementById('main-app').style.display = 'none';
    }
});

// ==========================================
// 3. DATA LISTENERS
// ==========================================
function startSettingsListener() {
    unsubSets = db.collection("settings").doc("dkpPoints").onSnapshot(doc => {
        if(doc.exists) { dkpPoints = doc.data(); updatePointText(); updateLive(); }
    });
}

function startPlayerListeners(uid) {
    unsubLogs = db.collection("guildLog").where("userId", "==", uid).onSnapshot(snap => {
        cloudPlayers = []; snap.forEach(doc => { let d = doc.data(); d.id = doc.id; cloudPlayers.push(d); });
        cloudPlayers.sort((a,b) => b.timestampMs - a.timestampMs);
        displaySavedData();
    });
}

function startAdminListeners() {
    unsubLogs = db.collection("guildLog").onSnapshot(snap => {
        cloudPlayers = []; snap.forEach(doc => { let d = doc.data(); d.id = doc.id; cloudPlayers.push(d); });
        cloudPlayers.sort((a,b) => b.timestampMs - a.timestampMs);
        displaySavedData(); updateCombineCheckboxes();
    });
    unsubComb = db.collection("guildCombinedLogs").onSnapshot(snap => {
        cloudCombined = []; snap.forEach(doc => { let d = doc.data(); d.id = doc.id; cloudCombined.push(d); });
        renderCombinedCards();
    });
}

// ==========================================
// 4. CORE FUNCTIONS
// ==========================================
function updatePointText() {
    const ps = isCombinedMode ? `T4/T5: ${dkpPoints.t4t5} pts | Deads: ${dkpPoints.deads} pts` : `T4: ${dkpPoints.t4} | T5: ${dkpPoints.t5} | Deads: ${dkpPoints.deads}`;
    document.getElementById("pointValues").innerText = ps;
}

function savePlayer() {
    const n = document.getElementById("name").value, sp = Number(document.getElementById("startingPower").value.replace(/,/g,'')) || 0;
    const t4 = isCombinedMode ? 0 : (Number(document.getElementById("t4").value.replace(/,/g,'')) || 0);
    const t5 = isCombinedMode ? 0 : (Number(document.getElementById("t5").value.replace(/,/g,'')) || 0);
    const t4t5 = isCombinedMode ? (Number(document.getElementById("t4t5").value.replace(/,/g,'')) || 0) : 0;
    const d = Number(document.getElementById("deads").value.replace(/,/g,'')) || 0;
    db.collection("guildLog").add({ userId: currentUserId, name: n, startingPower: sp, t4, t5, t4t5, deads: d, dkp: (t4*dkpPoints.t4)+(t5*dkpPoints.t5)+(t4t5*dkpPoints.t4t5)+(d*dkpPoints.deads), timestampString: new Date().toLocaleString(), timestampMs: Date.now(), isCombined: isCombinedMode });
    ["startingPower","t4","t5","t4t5","deads"].forEach(id => document.getElementById(id).value="");
}

function displaySavedData() {
    const list = document.getElementById("savedDataList");
    let html = "";
    const groups = {}; cloudPlayers.forEach(p => { const k = p.name.toLowerCase(); if (!groups[k]) groups[k] = { name: p.name, entries: [] }; groups[k].entries.push(p); });
    const sorted = Object.values(groups).sort((a, b) => b.entries[0].startingPower - a.entries[0].startingPower);
    
    sorted.forEach(g => {
        const latest = g.entries[0], percent = latest.startingPower > 0 ? ((latest.dkp / latest.startingPower) * 100).toFixed(2) : 0;
        html += `<div class="unified-panel player-card"><div class="player-title">👤 ${g.name}</div>
            <div style="font-size:12px;">Power: ${latest.startingPower.toLocaleString()} | Progress: ${percent}%</div>
            <div class="progress-bg"><div class="progress-fill" style="width:${Math.min(percent,100)}%; background:#007aff;"></div></div>`;
        g.entries.forEach(e => { html += `<div class="log-entry"><strong>DKP: ${e.dkp.toLocaleString()}</strong><br><span style="font-size:10px; color:#888;">${e.timestampString}</span></div>`; });
        html += `<div class="card-actions"><button class="btn-small-discord" onclick="sendToDiscord('${g.name}')">👾 Share</button>
            <button class="btn-small-danger" onclick="clearLogs('${g.name}')">🗑️ Clear</button></div></div>`;
    });
    list.innerHTML = html || "<p style='text-align:center; font-size:12px; color:#999;'>No logs in your vault.</p>";
}

// Logic for formatting numbers
["startingPower","t4","t5","t4t5","deads"].forEach(id => {
    document.getElementById(id).addEventListener("input", function() {
        let v = this.value.replace(/,/g, "").replace(/\D/g, "");
        this.value = v ? parseInt(v).toLocaleString() : "";
        updateLive();
    });
});

function updateLive() {
    const sp = Number(document.getElementById("startingPower").value.replace(/,/g,'')) || 0;
    const t4 = isCombinedMode ? 0 : Number(document.getElementById("t4").value.replace(/,/g,'')) || 0;
    const t5 = isCombinedMode ? 0 : Number(document.getElementById("t5").value.replace(/,/g,'')) || 0;
    const t4t5 = isCombinedMode ? Number(document.getElementById("t4t5").value.replace(/,/g,'')) || 0 : 0;
    const d = Number(document.getElementById("deads").value.replace(/,/g,'')) || 0;
    const dkp = (t4*dkpPoints.t4)+(t5*dkpPoints.t5)+(t4t5*dkpPoints.t4t5)+(d*dkpPoints.deads);
    const p = sp > 0 ? (dkp/sp*100).toFixed(2) : 0;
    document.getElementById("live").innerText = `DKP: ${dkp.toLocaleString()} | ${p}%`;
}

// System Helpers
function toggleTheme() { document.body.classList.toggle("dark-mode"); }
function toggleKillMode() { isCombinedMode = !isCombinedMode; document.getElementById("t4").style.display = isCombinedMode ? "none" : "block"; document.getElementById("t5").style.display = isCombinedMode ? "none" : "block"; document.getElementById("t4t5").style.display = isCombinedMode ? "block" : "none"; updatePointText(); }
function openAdmin() { document.getElementById('adminModal').style.display='flex'; ["editT4","editT5","editT4T5","editDeads"].forEach(id => document.getElementById(id).value = dkpPoints[id.replace('edit','').toLowerCase()]); }
function closeAdmin() { document.getElementById('adminModal').style.display='none'; }
function saveAdminSettings() { const n = { t4: parseFloat(document.getElementById('editT4').value), t5: parseFloat(document.getElementById('editT5').value), t4t5: parseFloat(document.getElementById('editT4T5').value), deads: parseFloat(document.getElementById('editDeads').value) }; db.collection("settings").doc("dkpPoints").set(n).then(() => closeAdmin()); }
function clearLogs(name) { if(confirm(`Delete logs for ${name}?`)) cloudPlayers.filter(p => p.name.toLowerCase() === name.toLowerCase()).forEach(p => db.collection("guildLog").doc(p.id).delete()); }

// Quirk: Smash
function smashScreen() { document.getElementById("giant-hammer").classList.add("swinging"); setTimeout(() => { document.getElementById("impact-effect").classList.add("pow-active"); document.getElementById("main-app").classList.add("smashed"); }, 360); setTimeout(() => location.reload(), 4500); }

// Potato Engine
const engine = Engine.create(), world = engine.world, render = Render.create({ canvas: document.getElementById('potato-canvas'), engine, options:{ width: window.innerWidth, height: window.innerHeight, background:'transparent', wireframes:false } });
Composite.add(world, Bodies.rectangle(window.innerWidth/2, window.innerHeight+25, window.innerWidth*2, 50, {isStatic:true}));
Render.run(render); Runner.run(Runner.create(), engine);
let potatoes = [];
setInterval(() => { const r=15, b=Bodies.circle(Math.random()*window.innerWidth,-50,r,{restitution:0.3,density:0.05,render:{visible:false}}); Composite.add(world,b); potatoes.push({body:b, fs:r*2}); }, 250);
Events.on(render, 'afterRender', () => { const ctx = render.context; ctx.textAlign="center"; ctx.textBaseline="middle"; potatoes.forEach(p => { ctx.save(); ctx.globalAlpha=0.3; ctx.font=p.fs+"px Arial"; ctx.translate(p.body.position.x, p.body.position.y); ctx.rotate(p.body.angle); ctx.fillText('🥔',0,0); ctx.restore(); }); });
</script>
</body>
</html>
